<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" fill="none" preserveAspectRatio="xMaxYMax meet">
  <defs>
    <linearGradient id="stone-light" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#F5E9D0"/>
      <stop offset=".35" stop-color="#E4D5B8"/>
      <stop offset=".7" stop-color="#C9B898"/>
      <stop offset="1" stop-color="#A89878"/>
    </linearGradient>
    <linearGradient id="stone-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B5A485"/>
      <stop offset=".5" stop-color="#D4C5A8"/>
      <stop offset="1" stop-color="#F0E4CC"/>
    </linearGradient>
    <linearGradient id="dome-grad" x1=".3" y1="0" x2=".7" y2="1">
      <stop stop-color="#E8DCC0"/>
      <stop offset=".5" stop-color="#C8B898"/>
      <stop offset="1" stop-color="#988868"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".3" r=".5">
      <stop stop-color="#F8EDD9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#F8EDD9" stop-opacity="0"/>
    </radialGradient>
    <filter id="arch-soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- Soft glow behind the structure -->
  <ellipse cx="230" cy="200" rx="180" ry="160" fill="url(#glow)"/>

  <!-- Dome on top -->
  <g opacity=".9">
    <path d="M150 105 Q230 35 310 105 L310 140 L150 140 Z" fill="url(#dome-grad)" stroke="#988868" stroke-width="1.5"/>
    <ellipse cx="230" cy="140" rx="80" ry="10" fill="#988868" opacity=".4"/>
    <!-- Oculus / opening -->
    <ellipse cx="230" cy="85" rx="12" ry="8" fill="#3A4A3A" opacity=".5"/>
    <!-- Finial -->
    <circle cx="230" cy="65" r="5" fill="#C7A875"/>
    <path d="M230 70 L230 58" stroke="#C7A875" stroke-width="2"/>
  </g>

  <!-- Entablature / cornice -->
  <g opacity=".88">
    <rect x="135" y="140" width="190" height="12" fill="url(#stone-light)" stroke="#A89878" stroke-width="1"/>
    <rect x="140" y="152" width="180" height="6" fill="#C9B898" opacity=".6"/>
  </g>

  <!-- Main archway body -->
  <g opacity=".85">
    <!-- Left pier -->
    <path d="M135 158 L135 580 L175 580 L175 158 Z" fill="url(#stone-light)" stroke="#A89878" stroke-width="1.5"/>
    <!-- Right pier -->
    <path d="M285 158 L285 580 L325 580 L325 158 Z" fill="url(#stone-shadow)" stroke="#A89878" stroke-width="1.5"/>

    <!-- Inner arch opening (the void) -->
    <path d="M175 580 L175 280 Q175 200 230 200 Q285 200 285 280 L285 580 Z" fill="#F8F6F1" opacity=".92"/>

    <!-- Arch curve stones (voussoirs) -->
    <g stroke="#A89878" stroke-width="1" fill="none" opacity=".5">
      <path d="M175 280 Q175 200 230 200 Q285 200 285 280"/>
      <path d="M170 285 Q170 195 230 195 Q290 195 290 285"/>
    </g>

    <!-- Keystone -->
    <path d="M222 180 L238 180 L236 205 L224 205 Z" fill="url(#stone-light)" stroke="#988868" stroke-width="1"/>

    <!-- Column fluting (left pier) -->
    <g stroke="#B5A485" stroke-width=".8" opacity=".4">
      <line x1="145" y1="165" x2="145" y2="575"/>
      <line x1="155" y1="165" x2="155" y2="575"/>
      <line x1="165" y1="165" x2="165" y2="575"/>
    </g>
    <!-- Column fluting (right pier) -->
    <g stroke="#B5A485" stroke-width=".8" opacity=".4">
      <line x1="295" y1="165" x2="295" y2="575"/>
      <line x1="305" y1="165" x2="305" y2="575"/>
      <line x1="315" y1="165" x2="315" y2="575"/>
    </g>

    <!-- Base molding -->
    <rect x="130" y="575" width="200" height="8" fill="#A89878" opacity=".6"/>
    <rect x="125" y="583" width="210" height="6" fill="#988868" opacity=".5"/>
  </g>

  <!-- Steps at the bottom -->
  <g opacity=".7">
    <rect x="110" y="589" width="240" height="5" fill="#C9B898"/>
    <rect x="100" y="594" width="260" height="5" fill="#B5A485"/>
    <rect x="90" y="599" width="280" height="5" fill="#A89878"/>
  </g>

  <!-- Delicate ornament on the arch intrados -->
  <g stroke="#C7A875" stroke-width=".8" fill="none" opacity=".45">
    <path d="M230 210 L230 270"/>
    <circle cx="230" cy="240" r="3"/>
    <path d="M225 240 L235 240 M230 235 L230 245"/>
  </g>

  <!-- Fine topographic lines around the base (ground) -->
  <g stroke="#B5A485" stroke-width=".6" fill="none" opacity=".3">
    <path d="M0 605 Q115 600 230 608 Q345 616 460 605"/>
    <path d="M0 612 Q115 608 230 614 Q345 620 460 612"/>
  </g>
</svg>
